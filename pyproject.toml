[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gen-ai"
version = "0.1.0"
description = "Generative AI pet project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets",
    "matplotlib",
    "Pillow",
    "torch",
    "torchvision",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
